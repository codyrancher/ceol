<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
  <!-- Central node -->
  <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
  <!-- Outer nodes -->
  <circle cx="4" cy="5" r="1.8" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="5" r="1.8" fill="currentColor" stroke="none"/>
  <circle cx="4" cy="19" r="1.8" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="19" r="1.8" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="2.5" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="21.5" r="1.5" fill="currentColor" stroke="none"/>
  <!-- Connections -->
  <line x1="12" y1="12" x2="4" y2="5" stroke-width="1"/>
  <line x1="12" y1="12" x2="20" y2="5" stroke-width="1"/>
  <line x1="12" y1="12" x2="4" y2="19" stroke-width="1"/>
  <line x1="12" y1="12" x2="20" y2="19" stroke-width="1"/>
  <line x1="12" y1="12" x2="12" y2="2.5" stroke-width="1"/>
  <line x1="12" y1="12" x2="12" y2="21.5" stroke-width="1"/>
  <!-- Cross connections -->
  <line x1="4" y1="5" x2="20" y2="5" stroke-width="0.7"/>
  <line x1="4" y1="19" x2="20" y2="19" stroke-width="0.7"/>
  <line x1="4" y1="5" x2="4" y2="19" stroke-width="0.7"/>
  <line x1="20" y1="5" x2="20" y2="19" stroke-width="0.7"/>
</svg>
